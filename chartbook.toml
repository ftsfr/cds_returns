## CDS Contract Returns

Monthly returns for individual CDS contracts.

### Columns

| Column | Description |
|--------|-------------|
| unique_id | Contract identifier (ticker_tenor, e.g., AAPL_5Y) |
| ds | Month-end date |
| y | Monthly return |

### Return Calculation

