docs = """
## CDS Portfolio Cumulative Returns

Cumulative returns showing growth of $1 invested in CDS portfolios.

### Portfolio Structure

20 portfolios = 4 tenors (3Y, 5Y, 7Y, 10Y) x 5 credit quintiles

### Calculation

Cumulative return = Product of (1 + monthly return) over time
"""
