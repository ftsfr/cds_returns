## CDS Portfolio Returns

Monthly CDS portfolio returns calculated using He, Kelly, and Manela (2017) methodology.

### Portfolio Structure

20 portfolios = 4 tenors (3Y, 5Y, 7Y, 10Y) x 5 credit quintiles

### Return Formula

CDS Return = CDS spread carry + Spread change x Risky duration
"""

