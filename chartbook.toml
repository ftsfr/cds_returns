[project]
name = "CDS Returns"
description = "Monthly CDS portfolio returns following He, Kelly, and Manela (2017) methodology"
contributors = [
    "Jeremy Bejarano",
    "Kausthub Kesheva",
]
repo_url = "https://github.com/ftsfr/cds_returns"
copyright = "2025"
os_compatibility = [
    "Windows",
    "Linux",
    "MacOS",
]
requires_chartbook = ">=0.5.0"

[scripts]
build = "doit"

[notebooks.summary_cds_returns]
name = "summary_cds_returns"
description = "Summary statistics and visualization of CDS portfolio returns"
path = "_output/summary_cds_returns.ipynb"
publishable = true

[dataframes.ftsfr_cds_portfolio_returns]
name = "ftsfr_cds_portfolio_returns"
description = "Monthly CDS portfolio returns (20 portfolios: 4 tenors x 5 credit quintiles)"
sources = [
    "Markit CDS",
]
providers = [
    "WRDS",
]
contact_required = [
    "no",
]
pre_approved = [
    "No",
]
provider_links = [
    "https://wrds-www.wharton.upenn.edu/",
]
tags = [
    "CDS",
    "credit",
    "returns",
    "fixed income",
]
access_types = [
    "WRDS Subscription",
]
license = "WRDS"
restrictions = "No"
pull_method = "Pulled from WRDS Markit CDS database"
path = "./_data/ftsfr_cds_portfolio_returns.parquet"
date_col = "ds"
docs = """
## CDS Portfolio Returns

Monthly CDS portfolio returns calculated following He, Kelly, and Manela (2017) methodology.

### Columns

| Column | Description |
|--------|-------------|
| unique_id | Portfolio identifier (e.g., 5Y_Q1 = 5-year tenor, quintile 1) |
| ds | Month-end date |
| y | Monthly scaled return |

### Portfolio Construction

- 20 portfolios = 4 tenors (3Y, 5Y, 7Y, 10Y) × 5 credit quintiles
- Credit quintiles based on 5Y spreads: Q1 (safest) to Q5 (riskiest)
- Returns scaled to match 5Y volatility within each quintile

### Return Formula

$$
CDS Return_t = CDS_{t-1}/250 + ΔCDS_t × RD_{t-1}
$$

Where:
- First term: Carry return (daily accrual from previous spread)
- Second term: Spread change × Risky duration

### Data Source

WRDS Markit CDS data (USD contracts, XR restructuring clause, CompositeDepth5Y >= 3)
"""

